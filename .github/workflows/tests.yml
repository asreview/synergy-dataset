name: Test Dataset.toml tests
on: [push, pull_request]
jobs:
  toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install pytest pyalex
      - name: Test Dataset.toml
        run: |
          pytest tests/test_datasets_toml.py
